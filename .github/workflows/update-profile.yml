name: Update Naukri Profile

on:
  schedule:
    - cron: '0 4 * * *'  # Runs every day at 4:00 AM UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Setup ChromeDriver and Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-driver chromium-browser

      - name: Run profile update script
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NEW_DISPLAY_NAME: ${{ secrets.NEW_DISPLAY_NAME }}
        run: |
          python update_naukri_profile.py
